<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🥳恭喜你发现彩蛋🥳</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-image: url('02.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            font-family: system-ui, 'Segoe UI', 'Roboto', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: flex-start;  /* 整体靠左 */
            align-items: center;
            padding: 1rem;
            background-color: rgba(0, 0, 0, 0.4);
            background-blend-mode: overlay;
        }

        /* 卡片：窄宽度、靠左、内部居中 */
        .card {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 2rem;
            padding: 1.5rem;
            width: 100%;
            max-width: 320px;            /* 宽度约为原来的一半 */
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            margin-left: 0;
            margin-right: auto;
            /* 内部内容居中 */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title-section {
            text-align: center;
            margin-bottom: 1.5rem;
            width: 100%;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.3rem;
            color: #fff;
        }
        .sub {
            color: rgba(255,255,255,0.8);
            font-size: 0.8rem;
        }

        /* 播放器模块：白色半透明，内部内容居中 */
        .music-player {
            background: rgba(255, 255, 255, 0.7);
            border-radius: 1.5rem;
            padding: 1rem;
            margin-bottom: 1.5rem;
            backdrop-filter: blur(4px);
            color: #1e2a3a;
            width: 100%;                /* 占满卡片宽度 */
            text-align: center;         /* 内部文字居中 */
        }

        /* 歌曲切换按钮组 */
        .song-switch {
            display: flex;
            justify-content: center;    /* 按钮居中 */
            gap: 8px;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .song-btn {
            background: #0077b6;
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .song-btn.active {
            background: #023e8a;
            box-shadow: 0 0 0 2px #ffb703;
        }
        .song-btn:hover {
            background: #023e8a;
        }

        .current-song {
            font-weight: bold;
            margin-bottom: 0.8rem;
            font-size: 0.9rem;
            color: #023e8a;
            word-break: break-word;
            text-align: center;
        }

        /* 音频控件占满宽度 */
        .music-player audio {
            width: 100%;
            margin-bottom: 0.5rem;
        }

        /* 歌词容器：占满卡片宽度，内部歌词左对齐（便于阅读） */
        .lyrics-container {
            background: rgba(0, 0, 0, 0.65);
            border-radius: 1rem;
            padding: 0.8rem;
            max-height: 260px;
            overflow-y: auto;
            font-size: 0.85rem;
            line-height: 1.6;
            color: #f0f0f0;
            margin-top: 0.8rem;
            width: 100%;
            text-align: left;           /* 歌词左对齐，更自然 */
        }
        .lyrics-line {
            padding: 4px 8px;
            transition: 0.2s;
            border-radius: 8px;
            cursor: pointer;
            white-space: pre-wrap;
        }
        .lyrics-line.current {
            background: #ffb703;
            color: #1e2a3a;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .lyrics-container::-webkit-scrollbar {
            width: 4px;
        }
        .lyrics-container::-webkit-scrollbar-track {
            background: #555;
            border-radius: 10px;
        }
        .lyrics-container::-webkit-scrollbar-thumb {
            background: #ffb703;
            border-radius: 10px;
        }

        @media (max-width: 480px) {
            .card { max-width: 280px; padding: 1rem; }
            .lyrics-container { max-height: 200px; }
        }
    </style>
</head>
<body>
<div class="card">
    <div class="title-section">
        <h1>🎵 音楽を楽しもう！🎵</h1>
        <div class="sub">切换歌曲，歌词自动滚动</div>
    </div>

    <div class="music-player">
        <div class="song-switch" id="songSwitch"></div>
        <div class="current-song" id="currentSongLabel">加载中...</div>
        <audio id="audioPlayer" controls loop>
            <source src="" type="audio/mpeg">
            您的浏览器不支持 audio 元素。
        </audio>
        <p style="font-size: 0.7rem; margin-top: 6px; color: #333;">✨ 点击歌词可跳转 | 切换歌曲自动加载歌词</p>
    </div>

    <div class="lyrics-container" id="lyricsContainer">
        <div style="text-align:center; color:#aaa;">选择一首歌曲开始</div>
    </div>
</div>

<script>
    // ========== 请根据你实际的文件名修改（大小写、空格要完全一致） ==========
    const songs = [
        {
            name: "YELL - いきものがかり",
            mp3: "YELL - いきものがかり.mp3",
            lrc: "YELL - いきものがかり.lrc"
        },
        {
            name: "旅立ちの日に - さくら学院",
            mp3: "旅立ちの日に - さくら学院.mp3",
            lrc: "旅立ちの日に - さくら学院.lrc"
        },        
        {
            name: "plenty - 人間そっくり",
            mp3: "plenty - 人間そっくり.mp3",
            lrc: "plenty - 人間そっくり.lrc"
        }
    ];
    // ==================================================================

    const audio = document.getElementById('audioPlayer');
    const currentSongLabel = document.getElementById('currentSongLabel');
    const lyricsContainer = document.getElementById('lyricsContainer');
    const songSwitch = document.getElementById('songSwitch');

    let currentSongIndex = 0;
    let currentLyrics = [];
    let lyricElements = [];
    let currentLineIndex = -1;
    let isLyricsReady = false;

    function parseLrc(lrcText) {
        const lines = lrcText.split(/\r?\n/);
        const result = [];
        const timeRegex = /\[(\d{1,2}):(\d{1,2})(?:\.(\d{1,3}))?\]/;
        for (let line of lines) {
            line = line.trim();
            if (!line) continue;
            const match = timeRegex.exec(line);
            if (!match) continue;
            const minutes = parseInt(match[1], 10);
            const seconds = parseInt(match[2], 10);
            let millis = 0;
            if (match[3]) {
                let msStr = match[3].padEnd(3, '0');
                millis = parseInt(msStr, 10);
            }
            const totalSec = minutes * 60 + seconds + millis / 1000;
            let lyricText = line.replace(timeRegex, '').trim();
            if (lyricText === '') lyricText = '♪';
            result.push({ time: totalSec, text: lyricText });
        }
        result.sort((a, b) => a.time - b.time);
        return result;
    }

    function renderLyrics(lyrics) {
        if (!lyrics || lyrics.length === 0) {
            lyricsContainer.innerHTML = '<div style="text-align:center; color:#ffaa66;">歌词文件解析后为空，请检查格式</div>';
            lyricElements = [];
            return;
        }
        let html = '';
        for (let i = 0; i < lyrics.length; i++) {
            html += `<div class="lyrics-line" data-line-index="${i}">${escapeHtml(lyrics[i].text)}</div>`;
        }
        lyricsContainer.innerHTML = html;
        lyricElements = document.querySelectorAll('.lyrics-line');
        lyricElements.forEach((line, idx) => {
            line.addEventListener('click', () => {
                if (currentLyrics[idx]) {
                    audio.currentTime = currentLyrics[idx].time;
                    audio.play().catch(e => console.log("播放失败:", e));
                }
            });
        });
        currentLineIndex = -1;
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function updateLyricsHighlight(currentTime) {
        if (!currentLyrics.length) return;
        let newIndex = -1;
        for (let i = 0; i < currentLyrics.length; i++) {
            if (currentTime >= currentLyrics[i].time) {
                newIndex = i;
            } else {
                break;
            }
        }
        if (newIndex !== -1 && newIndex !== currentLineIndex) {
            if (currentLineIndex !== -1 && lyricElements[currentLineIndex]) {
                lyricElements[currentLineIndex].classList.remove('current');
            }
            currentLineIndex = newIndex;
            if (lyricElements[currentLineIndex]) {
                lyricElements[currentLineIndex].classList.add('current');
                lyricElements[currentLineIndex].scrollIntoView({
                    behavior: 'smooth',
                    block: 'center'
                });
            }
        }
    }

    async function loadSong(index) {
        if (index < 0 || index >= songs.length) return;
        currentSongIndex = index;
        const song = songs[currentSongIndex];
        currentSongLabel.innerText = `当前曲目：${song.name}`;
        audio.src = song.mp3;
        audio.load();
        lyricsContainer.innerHTML = '<div style="text-align:center; color:#aaa;">加载歌词中...</div>';
        currentLyrics = [];
        lyricElements = [];
        currentLineIndex = -1;
        isLyricsReady = false;
        try {
            const response = await fetch(song.lrc);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const lrcText = await response.text();
            const parsed = parseLrc(lrcText);
            if (parsed.length === 0) {
                lyricsContainer.innerHTML = '<div style="text-align:center; color:#ffaa66;">歌词文件解析后为空，请检查格式</div>';
            } else {
                currentLyrics = parsed;
                renderLyrics(currentLyrics);
                isLyricsReady = true;
            }
        } catch (err) {
            console.error("加载歌词失败:", err);
            lyricsContainer.innerHTML = `<div style="text-align:center; color:#ffaa66;">歌词加载失败：${song.lrc} 不存在或格式错误</div>`;
        }
        audio.play().catch(e => console.log("自动播放被阻止，请手动点击播放"));
    }

    function initButtons() {
        songSwitch.innerHTML = '';
        songs.forEach((song, idx) => {
            const btn = document.createElement('button');
            btn.className = 'song-btn';
            if (idx === 0) btn.classList.add('active');
            let shortName = song.name.length > 18 ? song.name.slice(0,16)+'…' : song.name;
            btn.textContent = `🎵 ${shortName}`;
            btn.dataset.index = idx;
            btn.addEventListener('click', () => {
                document.querySelectorAll('.song-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                loadSong(idx);
            });
            songSwitch.appendChild(btn);
        });
    }

    audio.addEventListener('timeupdate', () => {
        if (isLyricsReady && currentLyrics.length && audio.currentTime) {
            updateLyricsHighlight(audio.currentTime);
        }
    });

    initButtons();
    loadSong(0);
</script>
</body>
</html>
