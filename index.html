<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🎵 音乐 · 彩蛋验证</title>
    <!-- 引入 SheetJS 库用于解析 Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        /* ========== 全屏遮罩 + 自定义弹窗样式 ========== */
        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }
        .custom-modal {
            background: #fff;
            color: #333;
            border-radius: 2rem;
            padding: 1.5rem;
            width: 85%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 20px 35px rgba(0,0,0,0.3);
            font-family: system-ui, 'Segoe UI', sans-serif;
        }
        .custom-modal p {
            margin-bottom: 1rem;
            font-size: 1.1rem;
            font-weight: 500;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .custom-modal input {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 2rem;
            margin-bottom: 1rem;
            outline: none;
            text-align: center;
        }
        .custom-modal button {
            background: #0077b6;
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 1rem;
            cursor: pointer;
            margin: 0 5px;
        }
        .custom-modal button:hover {
            background: #023e8a;
        }
        .error-msg {
            color: #d32f2f;
            font-size: 0.8rem;
            margin-top: -0.5rem;
            margin-bottom: 0.8rem;
        }

        /* ========== 原有样式（音乐播放器相关，电脑端+手机端） ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 电脑端默认样式 */
        body {
            background-image: url('02.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #000;
            font-family: system-ui, 'Segoe UI', 'Roboto', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 1rem;
        }

        .card {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 2rem;
            padding: 1.5rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            margin-left: 0;
            margin-right: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title-section {
            text-align: center;
            margin-bottom: 1.5rem;
            width: 100%;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.3rem;
            color: #fff;
        }
        .sub {
            color: rgba(255,255,255,0.8);
            font-size: 0.8rem;
        }

        .music-player {
            background: rgba(255, 255, 255, 0.7);
            border-radius: 1.5rem;
            padding: 1rem;
            margin-bottom: 1.5rem;
            backdrop-filter: blur(4px);
            color: #1e2a3a;
            width: 100%;
            text-align: center;
        }

        .song-switch {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .song-btn {
            background: #0077b6;
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .song-btn.active {
            background: #023e8a;
            box-shadow: 0 0 0 2px #ffb703;
        }
        .current-song {
            font-weight: bold;
            margin-bottom: 0.8rem;
            font-size: 0.9rem;
            color: #023e8a;
            word-break: break-word;
        }
        .music-player audio {
            width: 100%;
            margin-bottom: 0.5rem;
        }
        .lyrics-container {
            background: rgba(0, 0, 0, 0.65);
            border-radius: 1rem;
            padding: 0.8rem;
            max-height: 260px;
            overflow-y: auto;
            font-size: 0.85rem;
            line-height: 1.6;
            color: #f0f0f0;
            margin-top: 0.8rem;
            width: 100%;
            text-align: left;
        }
        .lyrics-line {
            padding: 4px 8px;
            transition: 0.2s;
            border-radius: 8px;
            cursor: pointer;
            white-space: pre-wrap;
        }
        .lyrics-line.current {
            background: #ffb703;
            color: #1e2a3a;
            font-weight: bold;
        }
        .lyrics-container::-webkit-scrollbar {
            width: 4px;
        }
        .lyrics-container::-webkit-scrollbar-track {
            background: #555;
            border-radius: 10px;
        }
        .lyrics-container::-webkit-scrollbar-thumb {
            background: #ffb703;
            border-radius: 10px;
        }

        /* 手机端样式 (宽度 ≤ 768px) */
        @media (max-width: 768px) {
            body {
                background-image: url('mobile-02.jpg');
                background-size: cover;
                background-position: center;
                background-attachment: fixed;
                display: flex;
                justify-content: center;
                align-items: flex-end;
                padding: 1rem;
            }
            .card {
                display: none;
            }
            .mobile-container {
                width: 95%;
                max-width: 450px;
                margin-bottom: 4vh;
                background: rgba(0, 0, 0, 0.55);
                backdrop-filter: blur(12px);
                border-radius: 1.8rem;
                padding: 1rem;
                border: 1px solid rgba(255,255,255,0.2);
                box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            }
            .mobile-two-columns {
                display: flex;
                gap: 12px;
                margin-bottom: 1rem;
            }
            .mobile-song-list {
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            .mobile-song-btn {
                background: #0077b6;
                border: none;
                color: white;
                padding: 10px 6px;
                border-radius: 40px;
                font-size: 0.7rem;
                cursor: pointer;
                transition: 0.2s;
                text-align: center;
                word-break: break-word;
                line-height: 1.3;
            }
            .mobile-song-btn.active {
                background: #023e8a;
                box-shadow: 0 0 0 2px #ffb703;
            }
            .mobile-lyrics-area {
                flex: 1.8;
                background: rgba(0, 0, 0, 0.6);
                border-radius: 1rem;
                padding: 0.6rem;
                max-height: 200px;
                overflow-y: auto;
                font-size: 0.75rem;
                line-height: 1.5;
                color: #f0f0f0;
            }
            .mobile-lyrics-line {
                padding: 3px 5px;
                transition: 0.2s;
                border-radius: 6px;
                cursor: pointer;
                white-space: pre-wrap;
            }
            .mobile-lyrics-line.current {
                background: #ffb703;
                color: #1e2a3a;
                font-weight: bold;
            }
            .mobile-lyrics-area::-webkit-scrollbar {
                width: 3px;
            }
            .mobile-lyrics-area::-webkit-scrollbar-track {
                background: #444;
                border-radius: 10px;
            }
            .mobile-lyrics-area::-webkit-scrollbar-thumb {
                background: #ffb703;
                border-radius: 10px;
            }
            .mobile-current-song {
                font-weight: bold;
                margin-bottom: 0.5rem;
                font-size: 0.85rem;
                color: #ffb703;
                text-align: center;
                word-break: break-word;
            }
            .mobile-audio {
                width: 100%;
                margin-bottom: 0.3rem;
                border-radius: 30px;
            }
            .mobile-tip {
                font-size: 0.6rem;
                text-align: center;
                color: rgba(255,255,255,0.6);
                margin-top: 4px;
            }
        }

        @media (max-width: 480px) {
            .mobile-container {
                width: 98%;
                padding: 0.8rem;
            }
            .mobile-song-btn {
                font-size: 0.6rem;
                padding: 8px 4px;
            }
            .mobile-lyrics-area {
                max-height: 160px;
                font-size: 0.7rem;
            }
        }

        /* 主内容初始隐藏 */
        #mainContent {
            display: none;
        }
    </style>
</head>
<body>
    <!-- 主内容（音乐播放器） -->
    <div id="mainContent">
        <!-- 电脑端卡片 -->
        <div class="card">
            <div class="title-section">
                <h1>🎵 音楽を楽しもう！🎵</h1>
                <div class="sub">切换歌曲，歌词自动滚动</div>
            </div>
            <div class="music-player">
                <div class="song-switch" id="songSwitch"></div>
                <div class="current-song" id="currentSongLabel">加载中...</div>
                <audio id="audioPlayer" controls>
                    <source src="" type="audio/mpeg">
                    您的浏览器不支持 audio 元素。
                </audio>
                <p style="font-size: 0.7rem; margin-top: 6px; color: #333;">✨ 点击歌词可跳转 | 播放结束后自动下一首</p>
            </div>
            <div class="lyrics-container" id="lyricsContainer">
                <div style="text-align:center; color:#aaa;">选择一首歌曲开始</div>
            </div>
        </div>
    </div>

    <script>
        // 全局映射表
        let authMap = {};

        // 自定义弹窗函数 (模拟 prompt，返回 Promise<string | null>)
        function customPrompt(question, isPassword = false) {
            return new Promise((resolve) => {
                const overlay = document.createElement('div');
                overlay.className = 'custom-modal-overlay';
                const modal = document.createElement('div');
                modal.className = 'custom-modal';
                modal.innerHTML = `
                    <p>${question}</p>
                    <input type="${isPassword ? 'password' : 'text'}" id="customInput" autocomplete="off">
                    <div class="error-msg" id="errorMsg" style="display:none;"></div>
                    <div>
                        <button id="confirmBtn">确定</button>
                    </div>
                `;
                overlay.appendChild(modal);
                document.body.appendChild(overlay);
                const input = modal.querySelector('#customInput');
                const confirmBtn = modal.querySelector('#confirmBtn');
                const errorMsgDiv = modal.querySelector('#errorMsg');
                input.focus();

                const cleanup = () => {
                    overlay.remove();
                };

                const submit = () => {
                    const val = input.value.trim();
                    if (val === "") {
                        errorMsgDiv.textContent = "请输入内容";
                        errorMsgDiv.style.display = "block";
                        return;
                    }
                    cleanup();
                    resolve(val);
                };

                confirmBtn.onclick = submit;
                input.onkeypress = (e) => {
                    if (e.key === 'Enter') submit();
                };
            });
        }

        // 自定义 alert
        function customAlert(message) {
            return new Promise((resolve) => {
                const overlay = document.createElement('div');
                overlay.className = 'custom-modal-overlay';
                const modal = document.createElement('div');
                modal.className = 'custom-modal';
                modal.innerHTML = `
                    <p>${message.replace(/\n/g, '<br>')}</p>
                    <button id="alertOkBtn">确定</button>
                `;
                overlay.appendChild(modal);
                document.body.appendChild(overlay);
                const okBtn = modal.querySelector('#alertOkBtn');
                okBtn.onclick = () => {
                    overlay.remove();
                    resolve();
                };
            });
        }

        // 加载 Excel 文件并构建映射
        async function loadAuthData() {
            const response = await fetch('data.xlsx');
            if (!response.ok) throw new Error('Excel 文件未找到，请确保 data.xlsx 与 index.html 在同一目录');
            const data = await response.arrayBuffer();
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: "" });
            if (!rows || rows.length < 2) throw new Error('Excel 至少需要两行数据');
            for (let i = 0; i < rows.length; i++) {
                const row = rows[i];
                if (row.length < 2) continue;
                const name = row[0] ? String(row[0]).trim() : '';
                const answer = row[1] ? String(row[1]).trim() : '';
                if (name && answer) {
                    authMap[name] = answer;
                }
            }
            if (Object.keys(authMap).length === 0) throw new Error('Excel 中未找到有效的姓名-答案对');
            console.log('验证数据加载成功，共', Object.keys(authMap).length, '条');
        }

        // 读取专属彩蛋文本
        async function loadSpecialEgg() {
            try {
                const response = await fetch('xzq.txt');
                if (!response.ok) return null;
                const text = await response.text();
                return text.trim();
            } catch (e) {
                console.error('读取专属彩蛋失败', e);
                return null;
            }
        }

        // 验证流程（循环直到正确）
        async function startVerification() {
            await loadAuthData();
            let verifiedName = null;

            while (true) {
                const name = await customPrompt("名前は：");
                if (name === null) continue;

                const expectedAnswer = authMap[name];
                if (expectedAnswer === undefined) {
                    await customAlert("ここから先は立ち入り禁止");
                    continue;
                }

                const userAnswer = await customPrompt("先生からもらった日本語は：");
                if (userAnswer === null) continue;

                if (userAnswer !== expectedAnswer) {
                    await customAlert("输入有误哦");
                    continue;
                }

                // 验证通过，记录姓名
                verifiedName = name;
                break;
            }
            return verifiedName;
        }

        // 以下是你原有的音乐播放器所有 JavaScript 代码
        const songs = [
            { name: "YELL - いきものがかり", mp3: "YELL - いきものがかり.mp3", lrc: "YELL - いきものがかり.lrc" },
            { name: "旅立ちの日に - さくら学院", mp3: "旅立ちの日に - さくら学院.mp3", lrc: "旅立ちの日に - さくら学院.lrc" },
            { name: "plenty - 人間そっくり", mp3: "plenty - 人間そっくり.mp3", lrc: "plenty - 人間そっくり.lrc" }
        ];

        let audio = null;
        let currentSongIndex = 0;
        let currentLyrics = [];
        let lyricElements = [];
        let currentLineIndex = -1;
        let isLyricsReady = false;

        let mobileContainer = null;
        let mobileSongList = null;
        let mobileLyricsArea = null;
        let mobileCurrentSongLabel = null;
        let mobileAudio = null;

        function parseLrc(lrcText) {
            const lines = lrcText.split(/\r?\n/);
            const result = [];
            const timeRegex = /\[(\d{1,2}):(\d{1,2})(?:\.(\d{1,3}))?\]/;
            for (let line of lines) {
                line = line.trim();
                if (!line) continue;
                const match = timeRegex.exec(line);
                if (!match) continue;
                const minutes = parseInt(match[1], 10);
                const seconds = parseInt(match[2], 10);
                let millis = 0;
                if (match[3]) {
                    let msStr = match[3].padEnd(3, '0');
                    millis = parseInt(msStr, 10);
                }
                const totalSec = minutes * 60 + seconds + millis / 1000;
                let lyricText = line.replace(timeRegex, '').trim();
                if (lyricText === '') lyricText = '♪';
                result.push({ time: totalSec, text: lyricText });
            }
            result.sort((a, b) => a.time - b.time);
            return result;
        }

        function renderLyricsPc(lyrics) {
            const container = document.getElementById('lyricsContainer');
            if (!lyrics || lyrics.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:#ffaa66;">歌词文件解析后为空</div>';
                lyricElements = [];
                return;
            }
            let html = '';
            for (let i = 0; i < lyrics.length; i++) {
                html += `<div class="lyrics-line" data-line-index="${i}">${escapeHtml(lyrics[i].text)}</div>`;
            }
            container.innerHTML = html;
            lyricElements = document.querySelectorAll('#lyricsContainer .lyrics-line');
            lyricElements.forEach((line, idx) => {
                line.addEventListener('click', () => {
                    if (currentLyrics[idx]) {
                        audio.currentTime = currentLyrics[idx].time;
                        audio.play().catch(e => console.log("播放失败:", e));
                    }
                });
            });
            currentLineIndex = -1;
        }

        function renderLyricsMobile(lyrics) {
            if (!mobileLyricsArea) return;
            if (!lyrics || lyrics.length === 0) {
                mobileLyricsArea.innerHTML = '<div style="text-align:center; color:#ffaa66;">歌词为空</div>';
                lyricElements = [];
                return;
            }
            let html = '';
            for (let i = 0; i < lyrics.length; i++) {
                html += `<div class="mobile-lyrics-line" data-line-index="${i}">${escapeHtml(lyrics[i].text)}</div>`;
            }
            mobileLyricsArea.innerHTML = html;
            lyricElements = document.querySelectorAll('.mobile-lyrics-line');
            lyricElements.forEach((line, idx) => {
                line.addEventListener('click', () => {
                    if (currentLyrics[idx]) {
                        audio.currentTime = currentLyrics[idx].time;
                        audio.play().catch(e => console.log("播放失败:", e));
                    }
                });
            });
            currentLineIndex = -1;
        }

        function updateLyricsHighlightPc(currentTime) {
            if (!currentLyrics.length) return;
            let newIndex = -1;
            for (let i = 0; i < currentLyrics.length; i++) {
                if (currentTime >= currentLyrics[i].time) newIndex = i;
                else break;
            }
            if (newIndex !== -1 && newIndex !== currentLineIndex) {
                if (currentLineIndex !== -1 && lyricElements[currentLineIndex]) {
                    lyricElements[currentLineIndex].classList.remove('current');
                }
                currentLineIndex = newIndex;
                if (lyricElements[currentLineIndex]) {
                    lyricElements[currentLineIndex].classList.add('current');
                    lyricElements[currentLineIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }

        function updateLyricsHighlightMobile(currentTime) {
            if (!currentLyrics.length) return;
            let newIndex = -1;
            for (let i = 0; i < currentLyrics.length; i++) {
                if (currentTime >= currentLyrics[i].time) newIndex = i;
                else break;
            }
            if (newIndex !== -1 && newIndex !== currentLineIndex) {
                if (currentLineIndex !== -1 && lyricElements[currentLineIndex]) {
                    lyricElements[currentLineIndex].classList.remove('current');
                }
                currentLineIndex = newIndex;
                if (lyricElements[currentLineIndex]) {
                    lyricElements[currentLineIndex].classList.add('current');
                    lyricElements[currentLineIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }

        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        async function loadSong(index) {
            if (index < 0 || index >= songs.length) return;
            currentSongIndex = index;
            const song = songs[currentSongIndex];
            
            if (window.innerWidth <= 768 && mobileCurrentSongLabel) {
                mobileCurrentSongLabel.innerText = `${song.name}`;
            } else {
                const pcLabel = document.getElementById('currentSongLabel');
                if (pcLabel) pcLabel.innerText = `当前曲目：${song.name}`;
            }
            
            audio.src = song.mp3;
            audio.load();
            
            currentLyrics = [];
            lyricElements = [];
            currentLineIndex = -1;
            isLyricsReady = false;
            
            try {
                const response = await fetch(song.lrc);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const lrcText = await response.text();
                const parsed = parseLrc(lrcText);
                if (parsed.length === 0) {
                    if (window.innerWidth <= 768 && mobileLyricsArea) {
                        mobileLyricsArea.innerHTML = '<div style="text-align:center; color:#ffaa66;">歌词解析为空</div>';
                    } else {
                        const pcContainer = document.getElementById('lyricsContainer');
                        if (pcContainer) pcContainer.innerHTML = '<div style="text-align:center; color:#ffaa66;">歌词解析为空</div>';
                    }
                } else {
                    currentLyrics = parsed;
                    if (window.innerWidth <= 768) {
                        renderLyricsMobile(currentLyrics);
                    } else {
                        renderLyricsPc(currentLyrics);
                    }
                    isLyricsReady = true;
                }
            } catch (err) {
                console.error("加载歌词失败:", err);
                if (window.innerWidth <= 768 && mobileLyricsArea) {
                    mobileLyricsArea.innerHTML = `<div style="text-align:center; color:#ffaa66;">歌词加载失败</div>`;
                } else {
                    const pcContainer = document.getElementById('lyricsContainer');
                    if (pcContainer) pcContainer.innerHTML = `<div style="text-align:center; color:#ffaa66;">歌词加载失败</div>`;
                }
            }
            
            if (window.innerWidth <= 768) {
                const btns = document.querySelectorAll('.mobile-song-btn');
                btns.forEach((btn, i) => {
                    if (i === index) btn.classList.add('active');
                    else btn.classList.remove('active');
                });
            } else {
                const btns = document.querySelectorAll('#songSwitch .song-btn');
                btns.forEach((btn, i) => {
                    if (i === index) btn.classList.add('active');
                    else btn.classList.remove('active');
                });
            }
            
            audio.play().catch(e => console.log("自动播放被阻止，请手动点击播放"));
        }

        function playNext() {
            let nextIndex = (currentSongIndex + 1) % songs.length;
            loadSong(nextIndex);
        }

        function initPcButtons() {
            const container = document.getElementById('songSwitch');
            if (!container) return;
            container.innerHTML = '';
            songs.forEach((song, idx) => {
                const btn = document.createElement('button');
                btn.className = 'song-btn';
                if (idx === 0) btn.classList.add('active');
                let shortName = song.name.length > 18 ? song.name.slice(0,16)+'…' : song.name;
                btn.textContent = `🎵 ${shortName}`;
                btn.addEventListener('click', () => loadSong(idx));
                container.appendChild(btn);
            });
        }

        function initMobileButtons() {
            if (!mobileSongList) return;
            mobileSongList.innerHTML = '';
            songs.forEach((song, idx) => {
                const btn = document.createElement('button');
                btn.className = 'mobile-song-btn';
                if (idx === 0) btn.classList.add('active');
                btn.textContent = song.name.length > 20 ? song.name.slice(0,18)+'…' : song.name;
                btn.addEventListener('click', () => loadSong(idx));
                mobileSongList.appendChild(btn);
            });
        }

        function initLayout() {
            if (window.innerWidth <= 768) {
                const originalAudio = document.getElementById('audioPlayer');
                const originalLyrics = document.getElementById('lyricsContainer');
                if (originalAudio) originalAudio.style.display = 'none';
                if (originalLyrics) originalLyrics.style.display = 'none';
                
                mobileContainer = document.createElement('div');
                mobileContainer.className = 'mobile-container';
                mobileContainer.innerHTML = `
                    <div class="mobile-two-columns">
                        <div class="mobile-song-list" id="mobileSongList"></div>
                        <div class="mobile-lyrics-area" id="mobileLyricsArea">
                            <div style="text-align:center; color:#aaa;">选择歌曲</div>
                        </div>
                    </div>
                    <div class="mobile-current-song" id="mobileCurrentSongLabel">加载中...</div>
                    <audio class="mobile-audio" id="mobileAudio" controls></audio>
                    <div class="mobile-tip">✨ 点击歌词可跳转 | 播放结束后自动下一首</div>
                `;
                document.body.appendChild(mobileContainer);
                
                mobileSongList = document.getElementById('mobileSongList');
                mobileLyricsArea = document.getElementById('mobileLyricsArea');
                mobileCurrentSongLabel = document.getElementById('mobileCurrentSongLabel');
                mobileAudio = document.getElementById('mobileAudio');
                audio = mobileAudio;
                
                initMobileButtons();
                audio.addEventListener('timeupdate', () => {
                    if (isLyricsReady && currentLyrics.length && audio.currentTime) {
                        updateLyricsHighlightMobile(audio.currentTime);
                    }
                });
                audio.addEventListener('ended', playNext);
                loadSong(0);
            } else {
                audio = document.getElementById('audioPlayer');
                initPcButtons();
                audio.addEventListener('timeupdate', () => {
                    if (isLyricsReady && currentLyrics.length && audio.currentTime) {
                        updateLyricsHighlightPc(audio.currentTime);
                    }
                });
                audio.addEventListener('ended', playNext);
                loadSong(0);
            }
        }

        // 启动流程
        (async function() {
            // 显示加载提示
            const loadingOverlay = document.createElement('div');
            loadingOverlay.className = 'custom-modal-overlay';
            loadingOverlay.innerHTML = '<div class="custom-modal"><p>⏳ 加载验证数据中...</p></div>';
            document.body.appendChild(loadingOverlay);
            try {
                await loadAuthData();
                loadingOverlay.remove();
                const verifiedName = await startVerification();
                // 通用彩蛋
                await customAlert("恭喜你解锁彩蛋！考试别紧张，听两首歌放松一下吧！");
                // 专属彩蛋（仅限徐梓琪）
                if (verifiedName === "徐梓琪") {
                    const specialMsg = await loadSpecialEgg();
                    if (specialMsg) {
                        await customAlert(specialMsg);
                    } else {
                        console.warn("未找到 xzq.txt 或读取失败");
                    }
                }
                // 显示音乐播放器
                document.getElementById('mainContent').style.display = 'block';
                initLayout();
            } catch (err) {
                loadingOverlay.remove();
                await customAlert('数据加载失败: ' + err.message);
                document.body.innerHTML = '<div style="text-align:center; margin-top:20vh; color:white;">系统错误，请稍后重试。</div>';
            }
        })();
    </script>
</body>
</html>
