<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🥳恭喜你发现了彩蛋🥳</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-image: url('02.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #000;
            font-family: system-ui, 'Segoe UI', 'Roboto', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 1rem;
            position: relative;
        }
        .pc-main-wrapper {
            display: flex;
            align-items: stretch;
            gap: 30px;
            width: 100%;
        }
        .card {
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(6px);
            border-radius: 2rem;
            padding: 1.5rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .pc-side-image {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            height: auto;
            max-height: 100%;
        }
        .pc-side-image img {
            height: 100%;
            width: auto;
            max-height: 100%;
            max-width: 100%;
            border-radius: 12px;
            display: block;
            object-fit: contain;
        }
        .title-section {
            text-align: center;
            margin-bottom: 1.5rem;
            width: 100%;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.3rem;
            color: #fff;
        }
        .sub {
            color: rgba(255,255,255,0.8);
            font-size: 0.8rem;
        }
        .music-player {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
            border-radius: 1.5rem;
            padding: 1rem;
            margin-bottom: 1.5rem;
            width: 100%;
            text-align: center;
        }
        .song-switch {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .song-btn {
            background: #0077b6;
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .song-btn.active {
            background: #023e8a;
            box-shadow: 0 0 0 2px #ffb703;
        }
        .current-song {
            font-weight: bold;
            margin-bottom: 0.8rem;
            font-size: 0.9rem;
            color: #023e8a;
            word-break: break-word;
        }
        .music-player audio {
            width: 100%;
            margin-bottom: 0.5rem;
        }
        .mv-button {
            background: rgba(255, 255, 255, 0.8);
            border: none;
            color: #1e2a3a;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 5px;
            display: inline-block;
            font-weight: bold;
        }
        .mv-button:hover {
            background: white;
        }
        .lyrics-container {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            border-radius: 1rem;
            padding: 0.8rem;
            max-height: 260px;
            overflow-y: auto;
            font-size: 0.85rem;
            line-height: 1.6;
            color: #f0f0f0;
            width: 100%;
            text-align: left;
        }
        .lyrics-line {
            padding: 4px 8px;
            border-radius: 8px;
            cursor: pointer;
            white-space: pre-wrap;
        }
        .lyrics-line.current {
            background: #ffb703;
            color: #1e2a3a;
            font-weight: bold;
        }
        .lyrics-container::-webkit-scrollbar {
            width: 4px;
        }
        .lyrics-container::-webkit-scrollbar-track {
            background: #555;
            border-radius: 10px;
        }
        .lyrics-container::-webkit-scrollbar-thumb {
            background: #ffb703;
            border-radius: 10px;
        }
        .video-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 700px;
            max-width: 90vw;
            background: rgba(0,0,0,0.85);
            border-radius: 1rem;
            padding: 0.8rem;
            z-index: 2000;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.3);
            display: none;
        }
        .video-modal.active {
            display: block;
        }
        .video-modal .close-video {
            position: absolute;
            top: -12px;
            right: -12px;
            background: #ffb703;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.2rem;
            z-index: 2001;
            box-shadow: 0 0 4px black;
        }
        .video-modal video,
        .video-modal .video-js {
            width: 100%;
            border-radius: 12px;
        }
        @media (max-width: 768px) {
            body {
                background-image: url('mobile-02.jpg');
                background-size: cover;
                background-position: center;
                display: flex;
                justify-content: center;
                align-items: flex-end;
                padding: 1rem;
                flex-direction: column;
                justify-content: flex-end;
            }
            .mobile-top-image {
                position: fixed;
                left: 0;
                top: 8vh;
                width: auto;
                max-width: 150px;
                z-index: 10;
                pointer-events: none;
            }
            .mobile-top-image img {
                width: 100%;
                height: auto;
                border-radius: 12px;
                display: block;
            }
            .mobile-container {
                width: 95%;
                max-width: 450px;
                background: rgba(0, 0, 0, 0.4);
                backdrop-filter: blur(8px);
                border-radius: 1.8rem;
                padding: 1rem;
                border: 1px solid rgba(255,255,255,0.2);
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                position: relative;
                z-index: 5;
            }
            .mobile-two-columns {
                display: flex;
                gap: 12px;
                margin-bottom: 1rem;
                width: 100%;
            }
            .mobile-song-list {
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            .mobile-song-btn {
                background: #0077b6;
                border: none;
                color: white;
                padding: 10px 6px;
                border-radius: 40px;
                font-size: 0.7rem;
                cursor: pointer;
                text-align: center;
            }
            .mobile-song-btn.active {
                background: #023e8a;
                box-shadow: 0 0 0 2px #ffb703;
            }
            .mobile-lyrics-area {
                flex: 1.8;
                background: rgba(0, 0, 0, 0.5);
                backdrop-filter: blur(4px);
                border-radius: 1rem;
                padding: 0.6rem;
                max-height: 200px;
                overflow-y: auto;
                font-size: 0.75rem;
                line-height: 1.5;
                color: #f0f0f0;
            }
            .mobile-lyrics-line {
                padding: 3px 5px;
                border-radius: 6px;
                cursor: pointer;
            }
            .mobile-lyrics-line.current {
                background: #ffb703;
                color: #1e2a3a;
                font-weight: bold;
            }
            .mobile-current-song {
                font-weight: bold;
                margin-bottom: 0.5rem;
                font-size: 0.85rem;
                color: #ffb703;
                text-align: center;
                width: 100%;
            }
            .mobile-audio {
                width: 100%;
                margin-bottom: 0.3rem;
            }
            .mv-button {
                background: rgba(255,255,255,0.7);
                font-size: 0.7rem;
                margin-top: 6px;
            }
            .video-modal {
                position: fixed;
                bottom: 20px;
                right: 20px;
                top: auto;
                left: auto;
                width: 280px;
                background: rgba(0,0,0,0.85);
                border-radius: 12px;
                padding: 0;
                overflow: hidden;
                box-shadow: 0 4px 15px rgba(0,0,0,0.5);
                transform: none;
            }
            .video-modal .drag-handle {
                background: rgba(0,0,0,0.6);
                padding: 8px;
                text-align: center;
                color: #ffb703;
                font-size: 0.7rem;
                cursor: grab;
                user-select: none;
                touch-action: none;
                border-bottom: 1px solid rgba(255,255,255,0.3);
                z-index: 2002;
            }
            .video-modal .drag-handle:active {
                cursor: grabbing;
            }
            .video-modal .close-video {
                top: 5px;
                right: 5px;
                width: 24px;
                height: 24px;
                font-size: 1rem;
                z-index: 2003;
            }
            .video-modal .video-js,
            .video-modal video {
                border-radius: 0 0 12px 12px;
            }
        }
        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }
        .custom-modal {
            position: relative;
            background: #fff;
            color: #333;
            border-radius: 2rem;
            padding: 1.5rem;
            width: 85%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 20px 35px rgba(0,0,0,0.3);
            font-family: system-ui, 'Segoe UI', sans-serif;
        }
        .custom-modal .modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #999;
            background: none;
            border: none;
            line-height: 1;
        }
        .custom-modal .modal-close:hover {
            color: #333;
        }
        .custom-modal p {
            margin-bottom: 1rem;
            font-size: 1.1rem;
            font-weight: 500;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .custom-modal input {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 2rem;
            margin-bottom: 1rem;
            outline: none;
            text-align: center;
        }
        .custom-modal button {
            background: #0077b6;
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 1rem;
            cursor: pointer;
            margin: 0 5px;
        }
        .custom-modal button:hover {
            background: #023e8a;
        }
        .error-msg {
            color: #d32f2f;
            font-size: 0.8rem;
            margin-top: -0.5rem;
            margin-bottom: 0.8rem;
        }
        #mainContent {
            display: none;
        }
    </style>
</head>
<body>
    <div id="videoModal" class="video-modal">
        <div class="drag-handle">⋮⋮ 拖动移动窗口 ⋮⋮</div>
        <button class="close-video" id="closeVideoBtn">✕</button>
        <div id="videoContainer"></div>
    </div>

    <div id="mainContent" style="display: none;">
        <div class="pc-main-wrapper">
            <div class="card">
                <div class="title-section">
                    <h1>🎵 音楽を楽しもう！🎵</h1>
                    <div class="sub">切换歌曲，歌词自动滚动</div>
                </div>
                <div class="music-player">
                    <div class="song-switch" id="songSwitch"></div>
                    <div class="current-song" id="currentSongLabel">加载中...</div>
                    <audio id="audioPlayer" controls></audio>
                    <button class="mv-button" id="watchMVBtn">🎬 观看MV</button>
                </div>
                <div class="lyrics-container" id="lyricsContainer">
                    <div style="text-align:center; color:#aaa;">选择一首歌曲开始</div>
                </div>
            </div>
            <div class="pc-side-image" id="pcSideImage">
                <img src="卒業おめでとう(pc).png" alt="卒業おめでとう">
            </div>
        </div>
    </div>

    <script>
        // ========== 彩蛋映射（特殊用户） ==========
        const specialEggs = {
            "蒋珊": "全体起立！欢迎蒋哥莅临！！！👏👏 请蒋哥鉴赏！",
            "魏艳": "热烈欢迎年度最佳小语种同事魏女士莅临寒舍👏👏👏 请你们听歌🎶",
            "于颖": "热烈欢迎年度最佳小语种同事于女士莅临寒舍👏👏👏 请你们听歌🎶",
            "安尔蒂西亚": "你是最屌的吊毛！！！哈哈哈哈哈"
        };

        const mvMap = {
            "YELL - いきものがかり": "https://mv6.music.tc.qq.com/80E13F7987FB96C2F4531383C13025CF0717B6F8D446EA1244F8328EF243610A2E7696DD1A66447ECDE31EB41749DB03ZZqqmusic_default__v21ea05cc4/qmmv_0a6bbdhbbqbvisila4gqmdafb4evhwdoux4h7tnti4dqobyhb4ea.f9934.m3u8",
            "旅立ちの日に - さくら学院": "さくら学院 - 旅立ちの日にMV.mp4",
            "plenty - 人間そっくり": "人間そっくり-plenty.mp4"
        };

        let authMap = {};
        let currentVideoPlayer = null;
        let isVideoOpen = false;
        let audio = null;
        let currentSongIndex = 0;
        let currentLyrics = [];
        let lyricElements = [];
        let currentLineIndex = -1;
        let isLyricsReady = false;
        let mobileContainer = null, mobileSongList = null, mobileLyricsArea = null, mobileCurrentSongLabel = null, mobileAudio = null;
        let mobileImageDiv = null;

        // 需要隐藏图片的用户列表（游客 + 特殊四人）
        const hideImageForUsers = ["蒋珊", "魏艳", "于颖", "安尔蒂西亚", "游客"];

        // 是否允许自动播放（用户同意后设为 true）
        let autoPlayEnabled = false;

        // 自定义弹窗（普通消息）
        function customAlert(message) {
            return new Promise((resolve) => {
                const overlay = document.createElement('div');
                overlay.className = 'custom-modal-overlay';
                const modal = document.createElement('div');
                modal.className = 'custom-modal';
                modal.innerHTML = `<p>${message.replace(/\n/g, '<br>')}</p><button id="alertOkBtn">确定</button>`;
                overlay.appendChild(modal);
                document.body.appendChild(overlay);
                const okBtn = modal.querySelector('#alertOkBtn');
                okBtn.onclick = () => { overlay.remove(); resolve(); };
            });
        }

        // 自定义询问弹窗（两个“是”按钮 + 右上角关闭）
        function askPlayMusic() {
            return new Promise((resolve) => {
                const overlay = document.createElement('div');
                overlay.className = 'custom-modal-overlay';
                const modal = document.createElement('div');
                modal.className = 'custom-modal';
                modal.innerHTML = `
                    <span class="modal-close" id="askCloseBtn">✕</span>
                    <p>是否开始播放音乐</p>
                    <div>
                        <button id="yesBtn1">是</button>
                        <button id="yesBtn2">是</button>
                    </div>
                `;
                overlay.appendChild(modal);
                document.body.appendChild(overlay);
                const closeBtn = modal.querySelector('#askCloseBtn');
                const yesBtn1 = modal.querySelector('#yesBtn1');
                const yesBtn2 = modal.querySelector('#yesBtn2');
                const cleanup = () => overlay.remove();
                const handlePlay = () => {
                    cleanup();
                    resolve(true);
                };
                const handleClose = () => {
                    cleanup();
                    resolve(false);
                };
                yesBtn1.onclick = handlePlay;
                yesBtn2.onclick = handlePlay;
                closeBtn.onclick = handleClose;
            });
        }

        // 自定义带输入框的弹窗（用于姓名和日语输入）
        function customPrompt(question, isPassword = false) {
            return new Promise((resolve) => {
                const overlay = document.createElement('div');
                overlay.className = 'custom-modal-overlay';
                const modal = document.createElement('div');
                modal.className = 'custom-modal';
                modal.innerHTML = `
                    <p>${question}</p>
                    <input type="${isPassword ? 'password' : 'text'}" id="customInput" autocomplete="off">
                    <div class="error-msg" id="errorMsg" style="display:none;"></div>
                    <div><button id="confirmBtn">确定</button></div>
                `;
                overlay.appendChild(modal);
                document.body.appendChild(overlay);
                const input = modal.querySelector('#customInput');
                const confirmBtn = modal.querySelector('#confirmBtn');
                const errorMsgDiv = modal.querySelector('#errorMsg');
                input.focus();
                const cleanup = () => overlay.remove();
                const submit = () => {
                    const val = input.value.trim();
                    if (val === "") {
                        errorMsgDiv.textContent = "请输入内容";
                        errorMsgDiv.style.display = "block";
                        return;
                    }
                    cleanup();
                    resolve(val);
                };
                confirmBtn.onclick = submit;
                input.onkeypress = (e) => { if (e.key === 'Enter') submit(); };
            });
        }

        async function loadAuthData() {
            const response = await fetch('data.xlsx');
            if (!response.ok) throw new Error('Excel 文件未找到');
            const data = await response.arrayBuffer();
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: "" });
            if (!rows || rows.length < 2) throw new Error('Excel 至少两行数据');
            for (let i = 0; i < rows.length; i++) {
                const row = rows[i];
                if (row.length < 2) continue;
                const name = row[0] ? String(row[0]).trim() : '';
                const answer = row[1] ? String(row[1]).trim() : '';
                if (name && answer) authMap[name] = answer;
            }
            if (Object.keys(authMap).length === 0) throw new Error('Excel 无有效数据');
        }

        async function loadSpecialEgg() {
            try {
                const response = await fetch('xzq.txt');
                if (!response.ok) return null;
                return (await response.text()).trim();
            } catch(e) { return null; }
        }

        // 验证流程：管理员、游客、特殊用户、普通学生
        async function startVerification() {
            await loadAuthData();
            let verifiedName = null;
            let isAdmin = false;
            let isGuestOrSpecial = false;
            while (true) {
                const name = await customPrompt("名前は：");
                if (name === null) continue;
                const trimmedName = name.trim();
                if (trimmedName === "02") {
                    verifiedName = "管理员";
                    isAdmin = true;
                    break;
                }
                if (trimmedName === "游客") {
                    await customAlert("Welcome ！hope u enjoy the music");
                    verifiedName = "游客";
                    isGuestOrSpecial = true;
                    break;
                }
                if (specialEggs[trimmedName]) {
                    await customAlert(specialEggs[trimmedName]);
                    verifiedName = trimmedName;
                    isGuestOrSpecial = true;
                    break;
                }
                const expectedAnswer = authMap[trimmedName];
                if (expectedAnswer === undefined) {
                    await customAlert("ここから先は立ち入り禁止");
                    continue;
                }
                let answerValid = false;
                while (!answerValid) {
                    const userAnswer = await customPrompt("先生からもらった日本語は：");
                    if (userAnswer === null) continue;
                    if (userAnswer.trim() === expectedAnswer) {
                        answerValid = true;
                    } else {
                        await customAlert("输入有误哦");
                    }
                }
                verifiedName = trimmedName;
                break;
            }
            return { verifiedName, isAdmin, isGuestOrSpecial };
        }

        // 视频模块
        function closeVideo() {
            const modal = document.getElementById('videoModal');
            if (modal) modal.classList.remove('active');
            if (currentVideoPlayer) {
                currentVideoPlayer.dispose();
                currentVideoPlayer = null;
            }
            const container = document.getElementById('videoContainer');
            if (container) container.innerHTML = '';
            isVideoOpen = false;
            if (window.innerWidth <= 768) {
                modal.style.top = '';
                modal.style.left = '';
                modal.style.bottom = '20px';
                modal.style.right = '20px';
            }
        }

        function openMV(mvUrl, songName) {
            if (!mvUrl) {
                customAlert("抱歉，这首歌的MV暂时不可用。");
                return;
            }
            if (isVideoOpen) closeVideo();
            const modal = document.getElementById('videoModal');
            const container = document.getElementById('videoContainer');
            container.innerHTML = '';
            const videoElem = document.createElement('video');
            videoElem.id = 'mvPlayer';
            videoElem.className = 'video-js vjs-default-skin';
            videoElem.controls = true;
            videoElem.preload = 'auto';
            videoElem.setAttribute('playsinline', 'true');
            videoElem.style.width = '100%';
            container.appendChild(videoElem);
            let videoType = 'video/mp4';
            if (mvUrl.endsWith('.m3u8') || mvUrl.includes('.m3u8')) {
                videoType = 'application/x-mpegURL';
            } else if (mvUrl.endsWith('.mp4')) {
                videoType = 'video/mp4';
            }
            currentVideoPlayer = videojs(videoElem, {
                sources: [{ src: mvUrl, type: videoType }],
                autoplay: true,
                controls: true,
                fluid: true
            });
            currentVideoPlayer.on('error', function() {
                customAlert("MV播放失败，可能是链接失效或格式不支持。");
                closeVideo();
            });
            modal.classList.add('active');
            isVideoOpen = true;
            if (audio && !audio.paused) audio.pause();
        }

        // ========== 音乐播放器核心函数 ==========
        const songs = [
            { name: "YELL - いきものがかり", mp3: "YELL - いきものがかり.mp3", lrc: "YELL - いきものがかり.lrc" },
            { name: "旅立ちの日に - さくら学院", mp3: "旅立ちの日に - さくら学院.mp3", lrc: "旅立ちの日に - さくら学院.lrc" },
            { name: "plenty - 人間そっくり", mp3: "plenty - 人間そっくり.mp3", lrc: "plenty - 人間そっくり.lrc" }
        ];

        function parseLrc(lrcText) {
            const lines = lrcText.split(/\r?\n/);
            const result = [];
            const timeRegex = /\[(\d{1,2}):(\d{1,2})(?:\.(\d{1,3}))?\]/;
            for (let line of lines) {
                line = line.trim();
                if (!line) continue;
                const match = timeRegex.exec(line);
                if (!match) continue;
                const minutes = parseInt(match[1], 10);
                const seconds = parseInt(match[2], 10);
                let millis = 0;
                if (match[3]) {
                    let msStr = match[3].padEnd(3, '0');
                    millis = parseInt(msStr, 10);
                }
                const totalSec = minutes * 60 + seconds + millis / 1000;
                let lyricText = line.replace(timeRegex, '').trim();
                if (lyricText === '') lyricText = '♪';
                result.push({ time: totalSec, text: lyricText });
            }
            result.sort((a, b) => a.time - b.time);
            return result;
        }

        function renderLyricsPc(lyrics) {
            const container = document.getElementById('lyricsContainer');
            if (!lyrics || lyrics.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:#ffaa66;">歌词文件解析后为空</div>';
                lyricElements = [];
                return;
            }
            let html = '';
            for (let i = 0; i < lyrics.length; i++) {
                html += `<div class="lyrics-line" data-line-index="${i}">${escapeHtml(lyrics[i].text)}</div>`;
            }
            container.innerHTML = html;
            lyricElements = document.querySelectorAll('#lyricsContainer .lyrics-line');
            lyricElements.forEach((line, idx) => {
                line.addEventListener('click', () => {
                    if (currentLyrics[idx]) {
                        audio.currentTime = currentLyrics[idx].time;
                        if (autoPlayEnabled) audio.play().catch(e => console.log("播放失败:", e));
                    }
                });
            });
            currentLineIndex = -1;
        }

        function renderLyricsMobile(lyrics) {
            if (!mobileLyricsArea) return;
            if (!lyrics || lyrics.length === 0) {
                mobileLyricsArea.innerHTML = '<div style="text-align:center; color:#ffaa66;">歌词为空</div>';
                lyricElements = [];
                return;
            }
            let html = '';
            for (let i = 0; i < lyrics.length; i++) {
                html += `<div class="mobile-lyrics-line" data-line-index="${i}">${escapeHtml(lyrics[i].text)}</div>`;
            }
            mobileLyricsArea.innerHTML = html;
            lyricElements = document.querySelectorAll('.mobile-lyrics-line');
            lyricElements.forEach((line, idx) => {
                line.addEventListener('click', () => {
                    if (currentLyrics[idx]) {
                        audio.currentTime = currentLyrics[idx].time;
                        if (autoPlayEnabled) audio.play().catch(e => console.log("播放失败:", e));
                    }
                });
            });
            currentLineIndex = -1;
        }

        function updateLyricsHighlightPc(currentTime) {
            if (!currentLyrics.length) return;
            let newIndex = -1;
            for (let i = 0; i < currentLyrics.length; i++) {
                if (currentTime >= currentLyrics[i].time) newIndex = i;
                else break;
            }
            if (newIndex !== -1 && newIndex !== currentLineIndex) {
                if (currentLineIndex !== -1 && lyricElements[currentLineIndex]) lyricElements[currentLineIndex].classList.remove('current');
                currentLineIndex = newIndex;
                if (lyricElements[currentLineIndex]) {
                    lyricElements[currentLineIndex].classList.add('current');
                    lyricElements[currentLineIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }

        function updateLyricsHighlightMobile(currentTime) {
            if (!currentLyrics.length) return;
            let newIndex = -1;
            for (let i = 0; i < currentLyrics.length; i++) {
                if (currentTime >= currentLyrics[i].time) newIndex = i;
                else break;
            }
            if (newIndex !== -1 && newIndex !== currentLineIndex) {
                if (currentLineIndex !== -1 && lyricElements[currentLineIndex]) lyricElements[currentLineIndex].classList.remove('current');
                currentLineIndex = newIndex;
                if (lyricElements[currentLineIndex]) {
                    lyricElements[currentLineIndex].classList.add('current');
                    lyricElements[currentLineIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }

        function escapeHtml(str) {
            return str.replace(/[&<>]/g, m => (m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;')));
        }

        async function loadSong(index, shouldAutoPlay = autoPlayEnabled) {
            if (index < 0 || index >= songs.length) return;
            currentSongIndex = index;
            const song = songs[currentSongIndex];
            if (window.innerWidth <= 768 && mobileCurrentSongLabel) {
                mobileCurrentSongLabel.innerText = `${song.name}`;
            } else {
                const pcLabel = document.getElementById('currentSongLabel');
                if (pcLabel) pcLabel.innerText = `当前曲目：${song.name}`;
            }
            audio.src = song.mp3;
            audio.load();
            currentLyrics = [];
            lyricElements = [];
            currentLineIndex = -1;
            isLyricsReady = false;
            try {
                const response = await fetch(song.lrc);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const lrcText = await response.text();
                const parsed = parseLrc(lrcText);
                if (parsed.length === 0) {
                    if (window.innerWidth <= 768 && mobileLyricsArea) mobileLyricsArea.innerHTML = '<div style="text-align:center; color:#ffaa66;">歌词解析为空</div>';
                    else document.getElementById('lyricsContainer').innerHTML = '<div style="text-align:center; color:#ffaa66;">歌词解析为空</div>';
                } else {
                    currentLyrics = parsed;
                    if (window.innerWidth <= 768) renderLyricsMobile(currentLyrics);
                    else renderLyricsPc(currentLyrics);
                    isLyricsReady = true;
                }
            } catch (err) {
                console.error("加载歌词失败:", err);
                if (window.innerWidth <= 768 && mobileLyricsArea) mobileLyricsArea.innerHTML = `<div style="text-align:center; color:#ffaa66;">歌词加载失败</div>`;
                else document.getElementById('lyricsContainer').innerHTML = `<div style="text-align:center; color:#ffaa66;">歌词加载失败</div>`;
            }
            if (window.innerWidth <= 768) {
                const btns = document.querySelectorAll('.mobile-song-btn');
                btns.forEach((btn, i) => { if (i === index) btn.classList.add('active'); else btn.classList.remove('active'); });
            } else {
                const btns = document.querySelectorAll('#songSwitch .song-btn');
                btns.forEach((btn, i) => { if (i === index) btn.classList.add('active'); else btn.classList.remove('active'); });
            }
            // 根据 shouldAutoPlay 决定是否自动播放
            if (shouldAutoPlay && autoPlayEnabled) {
                audio.play().catch(e => console.log("自动播放被阻止，请手动点击播放"));
            }
        }

        function playNext() {
            let nextIndex = (currentSongIndex + 1) % songs.length;
            loadSong(nextIndex, true); // 自动下一首时尊重 autoPlayEnabled
        }

        function initPcButtons() {
            const container = document.getElementById('songSwitch');
            if (!container) return;
            container.innerHTML = '';
            songs.forEach((song, idx) => {
                const btn = document.createElement('button');
                btn.className = 'song-btn';
                if (idx === 0) btn.classList.add('active');
                let shortName = song.name.length > 18 ? song.name.slice(0,16)+'…' : song.name;
                btn.textContent = `🎵 ${shortName}`;
                btn.addEventListener('click', () => loadSong(idx, true));
                container.appendChild(btn);
            });
        }

        function initMobileButtons() {
            if (!mobileSongList) return;
            mobileSongList.innerHTML = '';
            songs.forEach((song, idx) => {
                const btn = document.createElement('button');
                btn.className = 'mobile-song-btn';
                if (idx === 0) btn.classList.add('active');
                btn.textContent = song.name.length > 20 ? song.name.slice(0,18)+'…' : song.name;
                btn.addEventListener('click', () => loadSong(idx, true));
                mobileSongList.appendChild(btn);
            });
        }

        function initLayout(hideImage) {
            if (window.innerWidth <= 768) {
                const pcWrapper = document.querySelector('.pc-main-wrapper');
                if (pcWrapper) pcWrapper.style.display = 'none';
                if (!hideImage && !mobileImageDiv) {
                    mobileImageDiv = document.createElement('div');
                    mobileImageDiv.className = 'mobile-top-image';
                    mobileImageDiv.innerHTML = '<img src="卒業おめでとう(mobile).png" alt="卒業おめでとう">';
                    document.body.appendChild(mobileImageDiv);
                } else if (hideImage && mobileImageDiv) {
                    mobileImageDiv.remove();
                    mobileImageDiv = null;
                }
                mobileContainer = document.createElement('div');
                mobileContainer.className = 'mobile-container';
                mobileContainer.innerHTML = `
                    <div class="mobile-two-columns">
                        <div class="mobile-song-list" id="mobileSongList"></div>
                        <div class="mobile-lyrics-area" id="mobileLyricsArea"><div style="text-align:center; color:#aaa;">选择歌曲</div></div>
                    </div>
                    <div class="mobile-current-song" id="mobileCurrentSongLabel">加载中...</div>
                    <audio class="mobile-audio" id="mobileAudio" controls></audio>
                    <button class="mv-button" id="mobileWatchMVBtn">🎬 观看MV</button>
                `;
                document.body.appendChild(mobileContainer);
                mobileSongList = document.getElementById('mobileSongList');
                mobileLyricsArea = document.getElementById('mobileLyricsArea');
                mobileCurrentSongLabel = document.getElementById('mobileCurrentSongLabel');
                mobileAudio = document.getElementById('mobileAudio');
                audio = mobileAudio;
                initMobileButtons();
                audio.addEventListener('timeupdate', () => {
                    if (isLyricsReady && currentLyrics.length && audio.currentTime) updateLyricsHighlightMobile(audio.currentTime);
                });
                audio.addEventListener('ended', playNext);
                loadSong(0, false); // 先不自动播放，等待弹窗
                const mobileMVBtn = document.getElementById('mobileWatchMVBtn');
                if (mobileMVBtn) {
                    mobileMVBtn.addEventListener('click', () => {
                        const currentSong = songs[currentSongIndex];
                        const mvUrl = mvMap[currentSong.name];
                        if (mvUrl) openMV(mvUrl, currentSong.name);
                        else customAlert("抱歉，这首歌的MV暂时不可用。");
                    });
                }
            } else {
                if (mobileContainer) mobileContainer.remove();
                if (mobileImageDiv) mobileImageDiv.remove();
                const pcWrapper = document.querySelector('.pc-main-wrapper');
                if (pcWrapper) pcWrapper.style.display = 'flex';
                const pcSideImage = document.getElementById('pcSideImage');
                if (pcSideImage) {
                    pcSideImage.style.display = hideImage ? 'none' : 'block';
                }
                audio = document.getElementById('audioPlayer');
                initPcButtons();
                audio.addEventListener('timeupdate', () => {
                    if (isLyricsReady && currentLyrics.length && audio.currentTime) updateLyricsHighlightPc(audio.currentTime);
                });
                audio.addEventListener('ended', playNext);
                loadSong(0, false); // 先不自动播放，等待弹窗
                const pcMVBtn = document.getElementById('watchMVBtn');
                if (pcMVBtn) {
                    pcMVBtn.addEventListener('click', () => {
                        const currentSong = songs[currentSongIndex];
                        const mvUrl = mvMap[currentSong.name];
                        if (mvUrl) openMV(mvUrl, currentSong.name);
                        else customAlert("抱歉，这首歌的MV暂时不可用。");
                    });
                }
            }
        }

        document.getElementById('closeVideoBtn')?.addEventListener('click', closeVideo);

        function initDrag() {
            const modal = document.getElementById('videoModal');
            const dragHandle = modal.querySelector('.drag-handle');
            if (!dragHandle || window.innerWidth > 768) return;
            let startX, startY, startLeft, startTop;
            let isDragging = false;
            const onTouchStart = (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                startX = touch.clientX;
                startY = touch.clientY;
                const rect = modal.getBoundingClientRect();
                startLeft = rect.left;
                startTop = rect.top;
                modal.style.left = startLeft + 'px';
                modal.style.top = startTop + 'px';
                modal.style.right = 'auto';
                modal.style.bottom = 'auto';
                isDragging = true;
            };
            const onTouchMove = (e) => {
                if (!isDragging) return;
                e.preventDefault();
                const touch = e.touches[0];
                const deltaX = touch.clientX - startX;
                const deltaY = touch.clientY - startY;
                let newLeft = startLeft + deltaX;
                let newTop = startTop + deltaY;
                const maxX = window.innerWidth - modal.offsetWidth;
                const maxY = window.innerHeight - modal.offsetHeight;
                newLeft = Math.min(Math.max(0, newLeft), maxX);
                newTop = Math.min(Math.max(0, newTop), maxY);
                modal.style.left = newLeft + 'px';
                modal.style.top = newTop + 'px';
            };
            const onTouchEnd = () => {
                isDragging = false;
            };
            dragHandle.addEventListener('touchstart', onTouchStart, { passive: false });
            dragHandle.addEventListener('touchmove', onTouchMove, { passive: false });
            dragHandle.addEventListener('touchend', onTouchEnd);
        }

        (async function() {
            initDrag();
            const loadingOverlay = document.createElement('div');
            loadingOverlay.className = 'custom-modal-overlay';
            loadingOverlay.innerHTML = '<div class="custom-modal"><p>⏳ 加载验证数据中...</p></div>';
            document.body.appendChild(loadingOverlay);
            try {
                await loadAuthData();
                loadingOverlay.remove();
                const { verifiedName, isAdmin, isGuestOrSpecial } = await startVerification();
                if (!isAdmin && !isGuestOrSpecial) {
                    await customAlert("恭喜你解锁彩蛋！考试别紧张，听两首歌放松一下吧！");
                    if (verifiedName === "徐梓琪") {
                        const specialMsg = await loadSpecialEgg();
                        if (specialMsg) await customAlert(specialMsg);
                    }
                }
                const shouldHideImage = (isGuestOrSpecial && verifiedName !== "管理员") ? true : false;
                document.getElementById('mainContent').style.display = 'block';
                initLayout(shouldHideImage);
                // 弹出询问是否播放音乐的弹窗
                const playChoice = await askPlayMusic();
                if (playChoice) {
                    autoPlayEnabled = true;
                    // 触发当前歌曲播放
                    if (audio && audio.src) {
                        audio.play().catch(e => console.log("播放失败:", e));
                    }
                }
            } catch (err) {
                loadingOverlay.remove();
                await customAlert('数据加载失败: ' + err.message);
                document.body.innerHTML = '<div style="text-align:center; margin-top:20vh; color:white;">系统错误，请稍后重试。</div>';
            }
        })();
    </script>
