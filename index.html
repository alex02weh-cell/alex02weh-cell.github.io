<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>三歌曲·歌词滚动播放器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-image: url('02.jpg');  /* 你的背景图 */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            font-family: system-ui, 'Segoe UI', 'Roboto', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            background-color: rgba(0, 0, 0, 0.4);
            background-blend-mode: overlay;
        }

        /* 主卡片：整体居中，深色半透明 */
        .card {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 2rem;
            padding: 1.5rem;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
        }

        .title-section {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.3rem;
            color: #fff;
        }
        .sub {
            color: rgba(255,255,255,0.8);
            font-size: 0.9rem;
        }

        /* 播放器模块：靠左 + 70% 不透明度 */
        .music-player {
            background: rgba(255, 255, 255, 0.7);   /* 70% 不透明度 */
            border-radius: 1.5rem;
            padding: 1rem;
            margin-bottom: 1.5rem;
            text-align: left;
            backdrop-filter: blur(4px);
            color: #1e2a3a;
            width: fit-content;          /* 宽度自适应内容 */
            min-width: 260px;
            max-width: 100%;
            margin-right: auto;           /* 靠左 */
        }

        /* 歌曲切换按钮组 */
        .song-switch {
            display: flex;
            gap: 10px;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .song-btn {
            background: #0077b6;
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .song-btn.active {
            background: #023e8a;
            box-shadow: 0 0 0 2px #ffb703;
        }
        .song-btn:hover {
            background: #023e8a;
        }

        .current-song {
            font-weight: bold;
            margin-bottom: 0.8rem;
            font-size: 1rem;
            color: #023e8a;
            word-break: break-word;
        }

        audio {
            width: 100%;
            margin-bottom: 0.5rem;
            border-radius: 40px;
        }

        /* 歌词容器：可滚动 */
        .lyrics-container {
            background: rgba(0, 0, 0, 0.65);
            border-radius: 1rem;
            padding: 0.8rem;
            max-height: 260px;
            overflow-y: auto;
            font-size: 0.9rem;
            line-height: 1.6;
            color: #f0f0f0;
            margin-top: 0.8rem;
        }
        .lyrics-line {
            padding: 4px 8px;
            transition: 0.2s;
            border-radius: 8px;
            cursor: pointer;
            white-space: pre-wrap;
        }
        .lyrics-line.current {
            background: #ffb703;
            color: #1e2a3a;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .lyrics-container::-webkit-scrollbar {
            width: 4px;
        }
        .lyrics-container::-webkit-scrollbar-track {
            background: #555;
            border-radius: 10px;
        }
        .lyrics-container::-webkit-scrollbar-thumb {
            background: #ffb703;
            border-radius: 10px;
        }

        @media (max-width: 480px) {
            .card { padding: 1rem; }
            .lyrics-container { max-height: 200px; }
            .music-player { min-width: 220px; }
        }
    </style>
</head>
<body>
<div class="card">
    <div class="title-section">
        <h1>🎵 三曲·歌词同步</h1>
        <div class="sub">切换歌曲，歌词自动滚动</div>
    </div>

    <div class="music-player">
        <div class="song-switch" id="songSwitch">
            <!-- 按钮会由js动态生成，确保顺序 -->
        </div>
        <div class="current-song" id="currentSongLabel">加载中...</div>
        <audio id="audioPlayer" controls loop>
            <source src="" type="audio/mpeg">
            您的浏览器不支持 audio 元素。
        </audio>
        <p style="font-size: 0.7rem; margin-top: 6px; color: #333;">✨ 点击歌词可跳转 | 切换歌曲自动加载歌词</p>
    </div>

    <div class="lyrics-container" id="lyricsContainer">
        <div style="text-align:center; color:#aaa;">选择一首歌曲开始</div>
    </div>
</div>

<script>
    // ========== 请修改以下配置（歌曲文件名和对应的 .lrc 文件名）==========
    const songs = [
        {
            name: "旅立ちの日に - さくら学院",
            mp3: "旅立ちの日に - さくら学院.mp3",
            lrc: "旅立ちの日に - さくら学院.lrc"
        },
        {
            name: "plenty - 人間そっくり",
            mp3: "plenty - 人間そっくり.mp3",
            lrc: "plenty - 人間そっくり.lrc"
        },
        {
            name: "YELL - 生物股长",
            mp3: "YELL - 生物股长.mp3",
            lrc: "YELL - 生物股长.lrc"
        }
    ];
    // ==================================================================

    // DOM 元素
    const audio = document.getElementById('audioPlayer');
    const currentSongLabel = document.getElementById('currentSongLabel');
    const lyricsContainer = document.getElementById('lyricsContainer');
    const songSwitch = document.getElementById('songSwitch');

    let currentSongIndex = 0;
    let currentLyrics = [];     // 存储解析后的 [{time: 秒数, text: 歌词}, ...]
    let lyricElements = [];
    let currentLineIndex = -1;
    let isLyricsReady = false;

    // 解析标准 .lrc 内容，返回数组 [{time: 秒数, text: 歌词}]
    function parseLrc(lrcText) {
        const lines = lrcText.split(/\r?\n/);
        const result = [];
        const timeRegex = /\[(\d{2}):(\d{2})(?:\.(\d{2,3}))?\]/g;
        
        for (let line of lines) {
            line = line.trim();
            if (!line) continue;
            // 提取所有时间标签
            let match;
            let times = [];
            let lastIndex = 0;
            while ((match = timeRegex.exec(line)) !== null) {
                const minutes = parseInt(match[1], 10);
                const seconds = parseInt(match[2], 10);
                let millis = 0;
                if (match[3]) {
                    // 补足到3位
                    let msStr = match[3].padEnd(3, '0');
                    millis = parseInt(msStr, 10);
                }
                const totalSec = minutes * 60 + seconds + millis / 1000;
                times.push(totalSec);
                lastIndex = match.index + match[0].length;
            }
            if (times.length === 0) continue;
            // 歌词文本（去掉所有时间标签后的部分）
            let lyricText = line.replace(/\[\d{2}:\d{2}(?:\.\d{2,3})?\]/g, '').trim();
            if (lyricText === '') lyricText = '♪';  // 纯时间标签行用音符占位
            
            for (let t of times) {
                result.push({ time: t, text: lyricText });
            }
        }
        // 按时间排序（有些lrc文件顺序可能乱）
        result.sort((a, b) => a.time - b.time);
        return result;
    }

    // 渲染歌词到容器
    function renderLyrics(lyrics) {
        if (!lyrics || lyrics.length === 0) {
            lyricsContainer.innerHTML = '<div style="text-align:center; color:#aaa;">暂无歌词，请检查 .lrc 文件</div>';
            lyricElements = [];
            return;
        }
        let html = '';
        for (let i = 0; i < lyrics.length; i++) {
            html += `<div class="lyrics-line" data-line-index="${i}">${escapeHtml(lyrics[i].text)}</div>`;
        }
        lyricsContainer.innerHTML = html;
        lyricElements = document.querySelectorAll('.lyrics-line');
        // 绑定点击跳转事件
        lyricElements.forEach((line, idx) => {
            line.addEventListener('click', () => {
                if (currentLyrics[idx]) {
                    audio.currentTime = currentLyrics[idx].time;
                    audio.play().catch(e => console.log("播放失败:", e));
                }
            });
        });
        currentLineIndex = -1;
    }

    // 简单防XSS
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }

    // 根据当前播放时间高亮歌词
    function updateLyricsHighlight(currentTime) {
        if (!currentLyrics.length) return;
        let newIndex = -1;
        for (let i = 0; i < currentLyrics.length; i++) {
            if (currentTime >= currentLyrics[i].time) {
                newIndex = i;
            } else {
                break;
            }
        }
        if (newIndex !== -1 && newIndex !== currentLineIndex) {
            if (currentLineIndex !== -1 && lyricElements[currentLineIndex]) {
                lyricElements[currentLineIndex].classList.remove('current');
            }
            currentLineIndex = newIndex;
            if (lyricElements[currentLineIndex]) {
                lyricElements[currentLineIndex].classList.add('current');
                lyricElements[currentLineIndex].scrollIntoView({
                    behavior: 'smooth',
                    block: 'center'
                });
            }
        }
    }

    // 加载歌曲（mp3 和 lrc）
    async function loadSong(index) {
        if (index < 0 || index >= songs.length) return;
        currentSongIndex = index;
        const song = songs[currentSongIndex];
        currentSongLabel.innerText = `当前曲目：${song.name}`;
        
        // 设置音频源
        audio.src = song.mp3;
        audio.load();
        
        // 清空旧歌词、重置高亮
        lyricsContainer.innerHTML = '<div style="text-align:center; color:#aaa;">加载歌词中...</div>';
        currentLyrics = [];
        lyricElements = [];
        currentLineIndex = -1;
        isLyricsReady = false;
        
        // 获取 .lrc 文件
        try {
            const response = await fetch(song.lrc);
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            const lrcText = await response.text();
            const parsed = parseLrc(lrcText);
            if (parsed.length === 0) {
                lyricsContainer.innerHTML = '<div style="text-align:center; color:#ffaa66;">歌词文件解析后为空，请检查格式</div>';
            } else {
                currentLyrics = parsed;
                renderLyrics(currentLyrics);
                isLyricsReady = true;
            }
        } catch (err) {
            console.error("加载歌词失败:", err);
            lyricsContainer.innerHTML = `<div style="text-align:center; color:#ffaa66;">歌词加载失败：${song.lrc} 不存在或格式错误</div>`;
        }
        
        // 尝试自动播放（由于用户点击了按钮，通常可以播放）
        audio.play().catch(e => {
            console.log("自动播放被浏览器阻止，请手动点击播放按钮");
            // 在播放器上显示一个提醒（可选）
        });
    }

    // 生成歌曲切换按钮
    function initButtons() {
        songSwitch.innerHTML = '';
        songs.forEach((song, idx) => {
            const btn = document.createElement('button');
            btn.className = 'song-btn';
            if (idx === 0) btn.classList.add('active');
            btn.textContent = `🎵 ${song.name.length > 18 ? song.name.slice(0,16)+'…' : song.name}`;
            btn.dataset.index = idx;
            btn.addEventListener('click', (e) => {
                // 更新按钮样式
                document.querySelectorAll('.song-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                loadSong(idx);
            });
            songSwitch.appendChild(btn);
        });
    }

    // 监听播放时间更新
    audio.addEventListener('timeupdate', () => {
        if (isLyricsReady && currentLyrics.length && audio.currentTime) {
            updateLyricsHighlight(audio.currentTime);
        }
    });

    // 初始化
    initButtons();
    loadSong(0); // 默认加载第一首
</script>
</body>
</html>
